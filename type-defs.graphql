scalar JSON

# common interface for all hashable nodes
# having a .hash property
interface Hashable @limit(default: 5000, max: 5000) {
    hash: String!
}

enum NodeType {
    Blob
    Tree
    WinRegValue
    WinRegKey
    Symbol
    Struct
    StructField
    DataType
}

enum DiffStatus {
    NEW
    MOD
    DEL
    UNCHANGED
}

enum CommitHistoryDirection {
    FORWARD
    BACKWARD
}

enum CommitScope {
    # Search within a single commit only
    SINGLE
    # Search within the commit and all its reachable history (backwards traversal)
    HISTORY
    # Search within the commit, its history, and all updates (bidirectional traversal)
    HISTORY_WITH_UPDATES
    # Search within a range of commits from startCommit to endCommit (inclusive)
    RANGE
}

# read: needed for HAS_WINREG
type Blob implements Hashable @query(read: true, aggregate: false) @mutation(operations: []) @limit(default: 5000, max: 5000) {
    hash: String! @unique
    has_winreg: WinRegKey @relationship(type: "HAS_WINREG", direction: OUT)
    has_symbol: [Symbol!]! @relationship(type: "HAS_SYMBOL", direction: OUT, properties: "HasNameRel")
    has_struct: [Struct!]! @relationship(type: "HAS_STRUCT", direction: OUT, properties: "HasNameRel")
}

type HasFilenameRel @relationshipProperties {
    name: String!
}

type HasNameRel @relationshipProperties {
    name: String!
}

type Tree implements Hashable @mutation(operations: []) @limit(default: 5000, max: 5000) {
    hash: String! @unique
    child_blobs: [Blob!]!
        @relationship(
            type: "HAS_CHILD_BLOB"
            direction: OUT
            properties: "HasFilenameRel"
        )
    child_trees: [Tree!]!
        @relationship(
            type: "HAS_CHILD_TREE"
            direction: OUT
            properties: "HasFilenameRel"
        )
}

type Commit implements Hashable @mutation(operations: []) @limit(default: 5000, max: 5000) {
    hash: String! @unique
    name: String!
    description: String
    date: DateTime!
    previous: Commit @relationship(type: "HAS_PREVIOUS", direction: OUT)
    next: [Commit!]! @relationship(type: "HAS_PREVIOUS", direction: IN)
    filesystem: Tree @relationship(type: "OWNS_FILESYSTEM", direction: OUT)
}

type Branch @mutation(operations: [])  {
    name: String!
    tracks: Commit @relationship(type: "TRACKS_COMMIT", direction: OUT)
}

# Plugins types
## Registry
type WinRegValue implements Hashable @mutation(operations: []) @limit(default: 5000, max: 5000) {
    hash: String! @unique
    type: String!
    value: String!
}

type WinRegKey implements Hashable @mutation(operations: []) @limit(default: 5000, max: 5000) {
    hash: String! @unique
    child_values: [WinRegValue!]!
        @relationship(
            type: "HAS_CHILD"
            direction: OUT
            properties: "HasFilenameRel"
        )
    child_keys: [WinRegKey!]!
        @relationship(
            type: "HAS_CHILD"
            direction: OUT
            properties: "HasFilenameRel"
        )
}

## PDBs
type Symbol implements Hashable @mutation(operations: []) @limit(default: 5000, max: 5000) {
    hash: String! @unique
    address: String!
    blob: Blob! @relationship(type: "HAS_SYMBOL", direction: IN, properties: "HasNameRel")
}

type Struct implements Hashable @mutation(operations: []) @limit(default: 5000, max: 5000) {
    hash: String! @unique
    size: Int!
    kind: String!
    fields: [StructField!]!
        @relationship(type: "HAS_FIELD", direction: OUT, properties: "HasNameRel")
    blob: Blob! @relationship(type: "HAS_STRUCT", direction: IN, properties: "HasNameRel")
}

type StructField implements Hashable @mutation(operations: []) @limit(default: 5000, max: 5000) {
    hash: String! @unique
    offset: Int!
    data_type: JSON!
    # type: DataType! @relationship(type: "HAS_DATA_TYPE", direction: OUT)
    struct: Struct! @relationship(type: "HAS_FIELD", direction: IN, properties: "HasNameRel")
}

type DataType implements Hashable @mutation(operations: []) @limit(default: 5000, max: 5000) {
    hash: String! @unique
    type: String!
    name: String
    array_counter: Int
    bit_position: Int
    bit_length: Int
    has_data_type: DataType @relationship(type: "HAS_DATA_TYPE", direction: OUT)
}

# custom types not part of Data model
type HashableNodeProps @query(read: false, aggregate: false) @mutation(operations: []) {
    hash: String!
    properties: JSON!
}

type DiffNodesAtResult @query(read: false, aggregate: false) @mutation(operations: []) {
    total_count: Int!
    items: [DiffItem!]!
}

type DiffItem @query(read: false, aggregate: false) @mutation(operations: []) {
    status: DiffStatus!
    path: String!
    type: NodeType!
    old_props: HashableNodeProps
    new_props: HashableNodeProps
}

type SearchResult @query(read: false, aggregate: false) @mutation(operations: []) {
    commit_name: String!
    commit_hash: String!
    hash: String!
    path: String!
}

type SymbolFetchResult @query(read: false, aggregate: false) @mutation(operations: []) {
    name: String!
    address: String!
}

type StructFieldFetchResult @query(read: false, aggregate: false) @mutation(operations: []) {
    name: String!
    offset: Int!
    data_type: JSON!
}

type StructFetchResult @query(read: false, aggregate: false) @mutation(operations: []) {
    name: String!
    size: Int!
    kind: String!
    fields: [StructFieldFetchResult!]!
}

input DiffNodesOptions {
    limit: Int
    offset: Int
    status_filter: [DiffStatus!]
}

input CommitRange {
    # The starting commit hash for the search range
    startCommit: String!
    # Defines the scope of commits to search within
    scope: CommitScope!
    # The ending commit hash (required when scope is RANGE, ignored otherwise)
    endCommit: String = null
}

# custom Queries
type Query {
    diffNodesAt(
        parent_label: String!
        base_node_hash: String!
        diffee_node_hash: String!
        at_path: String!
        max_depth: Int = null
        filter: [String!] = []
        with_intermediates: Boolean = false
        options: DiffNodesOptions = null
    ): DiffNodesAtResult!
    # fetches the commit history starting from a specific commit
    fetchCommitHistory(commit_hash: String!, direction: CommitHistoryDirection = BACKWARD): [Commit!]!
    # given a node hash, traverse the children nodes following the path
    traversePath(parent_label: String!, tree_hash: String!, path: String!): String
    # get all the possibile data labels associated with an os
    getCommitExtractedDataLabels(commit_hash: String!): [String!]!
    # search
    search(commit_range: CommitRange!, search_term: String!): [SearchResult!]!
    # fetch symbols
    fetchSymbols(blob_hash: String!, options: SymbolOptions): [SymbolFetchResult!]!
    # fetch structs
    fetchStructs(blob_hash: String!, options: StructOptions): [StructFetchResult!]!
}

# custom Subscriptions
type Subscription {
    # search (streaming) - results are streamed as they are found
    searchStream(commit_range: CommitRange!, search_term: String!): SearchResult!
}
