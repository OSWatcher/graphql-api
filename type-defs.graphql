scalar JSON

# common interface for all hashable nodes
# having a .hash property
interface Hashable {
    hash: String!
}

enum NodeType {
    Blob
    Tree
    WinRegValue
    WinRegKey
    Symbol
    WinStruct
    WinStructField
    WinDataType
}

enum DiffStatus {
    NEW
    MOD
    DEL
}

type Blob implements Hashable @mutation(operations: []) {
    hash: String! @unique
    has_winreg: WinRegKey @relationship(type: "HAS_WINREG", direction: OUT)
    has_symbol: [Symbol!]! @relationship(type: "HAS_SYMBOL", direction: OUT, properties: "HasNameRel")
    has_struct: [WinStruct!]! @relationship(type: "HAS_STRUCT", direction: OUT, properties: "HasNameRel")
}

type HasFilenameRel @relationshipProperties {
    name: String!
}

type HasNameRel @relationshipProperties {
    name: String!
}

type Tree implements Hashable @mutation(operations: []) {
    hash: String! @unique
    child_blobs: [Blob!]!
        @relationship(
            type: "HAS_CHILD_BLOB"
            direction: OUT
            properties: "HasFilenameRel"
        )
    child_trees: [Tree!]!
        @relationship(
            type: "HAS_CHILD_TREE"
            direction: OUT
            properties: "HasFilenameRel"
        )
}

type Commit implements Hashable @mutation(operations: []) {
    hash: String! @unique
    name: String!
    description: String
    date: String!
    previous: Commit @relationship(type: "HAS_PREVIOUS", direction: OUT)
    filesystem: Tree @relationship(type: "OWNS_FILESYSTEM", direction: OUT)
}

type Branch @mutation(operations: []) {
    name: String!
    tracks: Commit @relationship(type: "TRACKS_COMMIT", direction: OUT)
}

# Plugins types
## Registry
type WinRegValue implements Hashable @mutation(operations: []) {
    hash: String! @unique
    type: String!
    value: String!
}

type WinRegKey implements Hashable @mutation(operations: []) {
    hash: String! @unique
    child_values: [WinRegValue!]!
        @relationship(
            type: "HAS_CHILD"
            direction: OUT
            properties: "HasFilenameRel"
        )
    child_keys: [WinRegKey!]!
        @relationship(
            type: "HAS_CHILD"
            direction: OUT
            properties: "HasFilenameRel"
        )
}

## PDBs
type Symbol implements Hashable @mutation(operations: [])  {
    hash: String! @unique
    address: String!
    blob: Blob! @relationship(type: "HAS_SYMBOL", direction: IN, properties: "HasNameRel")
}

type WinStruct implements Hashable @mutation(operations: []) {
    hash: String! @unique
    size: Int!
    kind: String!
    fields: [WinStructField!]!
        @relationship(type: "HAS_FIELD", direction: OUT, properties: "HasNameRel")
    blob: Blob! @relationship(type: "HAS_STRUCT", direction: IN, properties: "HasNameRel")
}

type WinStructField implements Hashable @mutation(operations: []) {
    hash: String! @unique
    offset: Int!
    data_type: JSON!
    # type: WinDataType! @relationship(type: "HAS_DATA_TYPE", direction: OUT)
    struct: WinStruct! @relationship(type: "HAS_FIELD", direction: IN, properties: "HasNameRel")
}

type WinDataType implements Hashable @mutation(operations: []) {
    hash: String! @unique
    type: String!
    name: String
    array_counter: Int
    bit_position: Int
    bit_length: Int
    has_data_type: WinDataType @relationship(type: "HAS_DATA_TYPE", direction: OUT)
}

# custom types not part of Data model
type HashableNodeProps @query(read: false, aggregate: false) @mutation(operations: []) {
    hash: String!
    properties: JSON!
}

type DiffItem @query(read: false, aggregate: false) @mutation(operations: []) {
    status: DiffStatus!
    path: String!
    type: NodeType!
    old_props: HashableNodeProps
    new_props: HashableNodeProps
}

type SearchResult @query(read: false, aggregate: false) @mutation(operations: []) {
    commit_name: String!
    commit_hash: String!
    hash: String!
    path: String!
}

type SymbolFetchResult @query(read: false, aggregate: false) @mutation(operations: []) {
    name: String!
    address: String!
}

type WinStructFieldFetchResult @query(read: false, aggregate: false) @mutation(operations: []) {
    name: String!
    offset: Int!
    data_type: JSON!
}

type WinStructFetchResult @query(read: false, aggregate: false) @mutation(operations: []) {
    name: String!
    size: Int!
    kind: String!
    fields: [WinStructFieldFetchResult!]!
}

input DiffNodesOptions {
    limit: Int
    offset: Int
}

# custom Queries
type Query {
    diffNodesAt(
        parent_label: String!
        base_node_hash: String!
        diffee_node_hash: String!
        at_path: String!
        max_depth: Int = null
        filter: [String!] = []
        with_intermediates: Boolean = false
        options: DiffNodesOptions = null
    ): [DiffItem!]!
    # fetches the commit history of a branch
    fetchCommitHistory(branch_name: String!): [Commit!]!
    # given a node hash, traverse the children nodes following the path
    traversePath(parent_label: String!, tree_hash: String!, path: String!): String
    # get all the possibile data labels associated with an os
    getCommitExtractedDataLabels(commit_hash: String!): [String!]!
    # search
    search(search_term: String!): [SearchResult!]!
    # fetch symbols
    fetchSymbols(blob_hash: String!, options: SymbolOptions): [SymbolFetchResult!]!
    # fetch structs
    fetchStructs(blob_hash: String!, options: WinStructOptions): [WinStructFetchResult!]!
}
